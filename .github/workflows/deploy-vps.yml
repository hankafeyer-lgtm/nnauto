name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.APP_DIR }}"
            RESTART_CMD="${{ secrets.DEPLOY_RESTART_CMD }}"

            if [ -z "$APP_DIR" ]; then
              echo "APP_DIR secret is empty"
              exit 1
            fi

            if [ -z "$RESTART_CMD" ]; then
              echo "DEPLOY_RESTART_CMD secret is empty"
              exit 1
            fi

            if [ ! -d "$APP_DIR" ]; then
              echo "APP_DIR does not exist: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            if [ ! -d ".git" ]; then
              echo "Not a git repository: $APP_DIR"
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main

            npm ci
            npm run build

            bash -lc "$RESTART_CMD"

